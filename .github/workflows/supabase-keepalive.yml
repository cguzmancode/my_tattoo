name: Supabase Keepalive

# Free-tier Supabase projects pause after 7 days of inactivity. The detector
# is driven by DATABASE activity, not Auth config reads — hitting
# /auth/v1/settings does NOT touch Postgres and never resets the timer.
# Instead we call the public.keepalive() RPC via PostgREST: it runs a trivial
# query against Postgres, so the ping registers as real database activity.
# The function returns only server time and reads no application data.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod project (my_tattoo)
        env:
          PROJECT_REF: rxkycdzfylerkffnpony
          ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          curl -fsS -w "\nHTTP %{http_code}\n" -X POST \
            "https://${PROJECT_REF}.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Ping dev project (my_tattoo_dev)
        if: always()
        env:
          PROJECT_REF: pmcdrhgjycowyttdvvdo
          ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          curl -fsS -w "\nHTTP %{http_code}\n" -X POST \
            "https://${PROJECT_REF}.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
