name: Supabase Keepalive

# Free-tier Supabase projects pause after 7 days of inactivity.
# The auto-pause detector ignores service_role traffic (treated as internal
# admin activity). We hit /auth/v1/settings with the anon key — the same
# request the supabase-js SDK makes when a client initializes, so it counts
# as real user traffic.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod project (my_tattoo)
        env:
          PROJECT_REF: rxkycdzfylerkffnpony
          ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          curl -fsS -w "\nHTTP %{http_code}\n" \
            "https://${PROJECT_REF}.supabase.co/auth/v1/settings" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}"

      - name: Ping dev project (my_tattoo_dev)
        if: always()
        env:
          PROJECT_REF: pmcdrhgjycowyttdvvdo
          ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          curl -fsS -w "\nHTTP %{http_code}\n" \
            "https://${PROJECT_REF}.supabase.co/auth/v1/settings" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}"
